<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fanoos AI</title>
    <style>
        :root {
            --bg: #0a0e14;
            --panel: #11161f;
            --panel-2: #161c27;
            --border: #1f2937;
            --border-2: #2a3548;
            --text: #e6edf3;
            --muted: #7d8590;
            --accent: #f0b429;
            --accent-hi: #ffc94d;
            --user: #1e3a5f;
            --user-border: #2c5282;
            --assistant: #151b26;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(1200px 600px at 50% -200px, rgba(240, 180, 41, 0.08), transparent 70%), var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(17, 22, 31, 0.85);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .lantern {
            width: 24px;
            height: 32px;
            border-radius: 12px;
            background: radial-gradient(circle at 50% 35%, #fff2c2, var(--accent) 55%, #8a5c08);
            box-shadow: 0 0 22px rgba(240, 180, 41, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .lantern::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 16px;
            border: 1px solid rgba(240, 180, 41, 0.35);
        }

        .brand h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 11.5px;
            margin-top: 1px;
        }

        .spacer {
            flex: 1;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 7px 12px;
            border-radius: 9px;
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            color: var(--text);
            border-color: var(--border-2);
            background: var(--panel-2);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 32px 20px 24px;
            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar {
            width: 10px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
            border: 3px solid var(--bg);
        }

        .msg-wrap {
            max-width: 780px;
            margin: 0 auto 22px;
            display: flex;
            gap: 14px;
        }

        .msg-wrap.user {
            flex-direction: row-reverse;
        }

        .avatar {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--border-2);
        }

        .avatar.user {
            background: var(--user);
            color: #cfe3ff;
            border-color: var(--user-border);
        }

        .avatar.assistant {
            background: linear-gradient(135deg, #2a1e08, #4a330c);
            color: var(--accent-hi);
            border-color: #5c4310;
            box-shadow: 0 0 16px rgba(240, 180, 41, 0.18);
        }

        .bubble {
            padding: 13px 17px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 14.5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: calc(100% - 50px);
            border: 1px solid var(--border);
            background: var(--assistant);
        }

        .msg-wrap.user .bubble {
            background: var(--user);
            border-color: var(--user-border);
        }

        .bubble code.inline {
            background: #0a0e14;
            padding: 1.5px 6px;
            border-radius: 5px;
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 0.88em;
            color: #ffd479;
            border: 1px solid #1a1f2b;
        }

        .code-block {
            position: relative;
            margin: 10px 0;
            border-radius: 10px;
            background: #0a0e14;
            border: 1px solid #1a1f2b;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: #0e1420;
            border-bottom: 1px solid #1a1f2b;
            font-size: 11.5px;
            color: var(--muted);
            font-family: monospace;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            transition: all 0.15s;
        }

        .copy-btn:hover {
            color: var(--accent);
            background: rgba(240, 180, 41, 0.1);
        }

        .code-block pre {
            margin: 0;
            padding: 12px 14px;
            overflow-x: auto;
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 13px;
            color: #d9e1ea;
            line-height: 1.55;
        }

        .hint {
            max-width: 620px;
            margin: 60px auto;
            text-align: center;
            color: var(--muted);
        }

        .hint h2 {
            font-size: 22px;
            color: var(--text);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .hint p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .suggestion {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .suggestion:hover {
            border-color: var(--accent);
            color: var(--accent-hi);
            background: rgba(240, 180, 41, 0.06);
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            margin-left: 1px;
            background: var(--accent);
            vertical-align: middle;
            animation: blink 1s steps(2) infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        footer {
            padding: 14px 20px 18px;
            border-top: 1px solid var(--border);
            background: rgba(17, 22, 31, 0.85);
            backdrop-filter: blur(12px);
        }

        .composer {
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 16px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .composer:focus-within {
            border-color: rgba(240, 180, 41, 0.5);
            box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.08);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.5;
            padding: 8px 0;
            max-height: 200px;
            min-height: 24px;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        #send {
            background: var(--accent);
            color: #1b1200;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        #send:hover:not(:disabled) {
            background: var(--accent-hi);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(240, 180, 41, 0.3);
        }

        #send:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        #send svg {
            width: 18px;
            height: 18px;
        }

        .meta {
            max-width: 780px;
            margin: 8px auto 0;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }
    </style>
</head>
<body>
    <header>
        <div class="lantern"></div>
        <div class="brand">
            <h1>Fanoos AI</h1>
            <small>a tiny lantern-lit language model</small>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="newChat" title="Start a new chat">New chat</button>
    </header>

    <div id="chat">
        <div class="hint" id="hint">
            <h2>Ask Fanoos anything</h2>
            <p>Code, explanations, brainstorming — a small model doing its best.</p>
            <div class="suggestions">
                <button class="suggestion" data-p="Write a Python function that reverses a linked list.">Reverse a linked list</button>
                <button class="suggestion" data-p="Explain TCP vs UDP like I'm five.">TCP vs UDP, ELI5</button>
                <button class="suggestion" data-p="Give me a 3-step plan to learn machine learning.">Learn ML in 3 steps</button>
                <button class="suggestion" data-p="Write a haiku about lanterns.">Haiku about lanterns</button>
            </div>
        </div>
    </div>

    <footer>
        <form class="composer" id="form">
            <textarea id="input" rows="1" placeholder="Message Fanoos..." autocomplete="off" autofocus></textarea>
            <button id="send" type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 5l7 7-7 7" />
                </svg>
            </button>
        </form>
        <div class="meta">Fanoos may hallucinate. Verify important info.</div>
    </footer>

    <script>
        const chat = document.getElementById("chat");
        const hint = document.getElementById("hint");
        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const sendBtn = document.getElementById("send");
        const newChatBtn = document.getElementById("newChat");

        let history = [];
        let busy = false;

        function autosize() {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 200) + "px";
        }
        input.addEventListener("input", autosize);

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        document.querySelectorAll(".suggestion").forEach((b) => {
            b.addEventListener("click", () => {
                input.value = b.dataset.p;
                autosize();
                form.requestSubmit();
            });
        });

        function renderContent(text) {
            const frag = document.createDocumentFragment();
            const parts = text.split(/```(\w*)\n?([\s\S]*?)```/g);
            for (let i = 0; i < parts.length; i += 3) {
                const plain = parts[i];
                if (plain) frag.appendChild(renderInline(plain));
                if (i + 2 < parts.length) {
                    const lang = parts[i + 1] || "code";
                    const code = parts[i + 2];
                    frag.appendChild(makeCodeBlock(code, lang));
                }
            }
            return frag;
        }

        function renderInline(text) {
            const span = document.createElement("span");
            const tokens = text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*)/g);
            for (const t of tokens) {
                if (!t) continue;
                if (t.length > 2 && t.startsWith("`") && t.endsWith("`")) {
                    const c = document.createElement("code");
                    c.className = "inline";
                    c.textContent = t.slice(1, -1);
                    span.appendChild(c);
                } else if (t.startsWith("**") && t.endsWith("**")) {
                    const b = document.createElement("strong");
                    b.textContent = t.slice(2, -2);
                    span.appendChild(b);
                } else if (t.length > 2 && t.startsWith("*") && t.endsWith("*")) {
                    const em = document.createElement("em");
                    em.textContent = t.slice(1, -1);
                    span.appendChild(em);
                } else {
                    span.appendChild(document.createTextNode(t));
                }
            }
            return span;
        }

        function makeCodeBlock(code, lang) {
            const wrap = document.createElement("div");
            wrap.className = "code-block";
            const head = document.createElement("div");
            head.className = "code-header";
            const langEl = document.createElement("span");
            langEl.textContent = lang;
            const copyBtn = document.createElement("button");
            copyBtn.className = "copy-btn";
            copyBtn.textContent = "Copy";
            copyBtn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(code);
                    copyBtn.textContent = "Copied!";
                    setTimeout(() => (copyBtn.textContent = "Copy"), 1200);
                } catch {
                    copyBtn.textContent = "Failed";
                }
            });
            head.append(langEl, copyBtn);
            const pre = document.createElement("pre");
            pre.textContent = code.replace(/\n$/, "");
            wrap.append(head, pre);
            return wrap;
        }

        function addMessage(role, content) {
            if (hint && hint.parentNode) hint.remove();
            const wrap = document.createElement("div");
            wrap.className = "msg-wrap " + role;
            const av = document.createElement("div");
            av.className = "avatar " + role;
            av.textContent = role === "user" ? "U" : "F";
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            if (role === "assistant") {
                bubble.appendChild(renderContent(content));
            } else {
                bubble.textContent = content;
            }
            wrap.append(av, bubble);
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
            return bubble;
        }

        function setBusy(v) {
            busy = v;
            sendBtn.disabled = v;
        }
        
        async function submit(e) {
            e.preventDefault();
            const text = input.value.trim();
            if (!text || busy) return;
            input.value = "";
            autosize();
            setBusy(true);
            addMessage("user", text);
            history.push({
                role: "user",
                content: text
            });
            const bubble = addMessage("assistant", "");
            const cursor = document.createElement("span");
            cursor.className = "cursor";
            bubble.appendChild(cursor);
            let reply = "";
            try {
                const res = await fetch("/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "fanoos-ai",
                        messages: history,
                        stream: true,
                        temperature: 0.8,
                        top_k: 50,
                        top_p: 0.95,
                        max_tokens: 512,
                    }),
                });
                if (!res.ok) throw new Error("server error " + res.status);
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buf = "";
                while (true) {
                    const {
                        done,
                        value
                    } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, {
                        stream: true
                    });
                    const lines = buf.split("\n");
                    buf = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        const payload = line.slice(6).trim();
                        if (payload === "[DONE]") continue;
                        let chunk;
                        try {
                            chunk = JSON.parse(payload);
                        } catch {
                            continue;
                        }
                        const delta = chunk.choices?.[0]?.delta?.content;
                        if (delta) {
                            reply += delta;
                            bubble.textContent = "";
                            bubble.appendChild(renderContent(reply));
                            bubble.appendChild(cursor);
                            chat.scrollTop = chat.scrollHeight;
                        }
                    }
                }
                history.push({
                    role: "assistant",
                    content: reply
                });
            } catch (err) {
                bubble.textContent = "Error: " + err.message;
            } finally {
                cursor.remove();
                setBusy(false);
                input.focus();
            }
        }
        form.addEventListener("submit", submit);
        newChatBtn.addEventListener("click", () => {
            if (busy) return;
            history = [];
            chat.innerHTML = "";
            chat.appendChild(hint);
            input.focus();
        });
        window.addEventListener("load", () => input.focus());
    </script>
</body>
</html>
