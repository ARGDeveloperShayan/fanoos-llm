<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop LLM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .desktop {
            width: 100%;
            max-width: 1200px;
            height: 85vh;
            background: #f0f2f5;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar {
            width: 250px;
            background: white;
            padding: 25px;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 12px;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
        }

        .history-title {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .history-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .history-item:hover {
            background: #e9ecef;
            border-left-color: #667eea;
        }

        .history-item.active {
            background: #e3f2fd;
            border-left-color: #667eea;
        }

        .history-preview {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tools {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .tool-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
        }

        .chat-header h2 {
            color: #333;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-row {
            display: flex;
            gap: 15px;
            max-width: 80%;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .avatar.user {
            background: #764ba2;
        }

        .message-content {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 18px;
            color: #333;
            line-height: 1.5;
        }

        .message-row.user .message-content {
            background: #667eea;
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }

        .input-area {
            padding: 20px 30px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .input-container {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            padding: 15px 25px;
            font-size: 14px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .input-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="desktop">
        <div class="sidebar">
            <div class="logo">
                <h1>Desktop LLM</h1>
                <p>AI Assistant v2.0</p>
            </div>

            <div class="chat-history">
                <div class="history-title">Recent Chats</div>
                <div class="history-item active">
                    <div>Current Session</div>
                    <div class="history-preview">Hello! I'm Desktop LLM...</div>
                </div>
                <div class="history-item">
                    <div>Math Help</div>
                    <div class="history-preview">What is 5 + 3...</div>
                </div>
                <div class="history-item">
                    <div>Code Review</div>
                    <div class="history-preview">Can you review this code...</div>
                </div>
            </div>

            <div class="tools">
                <button class="tool-btn">
                    <span>💾</span>
                    <span>Save Chat</span>
                </button>
                <button class="tool-btn">
                    <span>🔄</span>
                    <span>New Chat</span>
                </button>
                <button class="tool-btn">
                    <span>⚙️</span>
                    <span>Settings</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="chat-header">
                <h2>Current Conversation</h2>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message-row assistant">
                    <div class="avatar">AI</div>
                    <div class="message-content">
                        Hello! I'm Desktop LLM. I'm designed to help you with various tasks in this desktop-style interface.
                        <div class="message-time">Just now</div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea class="input-field" id="userInput" placeholder="Type your message here..." rows="1"></textarea>
                    <button class="send-btn" onclick="sendMessage()">
                        <span style="font-size: 20px;">→</span>
                    </button>
                </div>
                <div class="input-actions">
                    <button class="action-btn" onclick="sendExample('Explain quantum computing')">Explain quantum</button>
                    <button class="action-btn" onclick="sendExample('Write a Python function')">Python help</button>
                    <button class="action-btn" onclick="sendExample('What is 8 ÷ 2?')">Math</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendExample(text) {
            userInput.value = text;
            sendMessage();
        }

        function addMessage(text, isUser) {
            const messageRow = document.createElement('div');
            messageRow.className = `message-row ${isUser ? 'user' : 'assistant'}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${isUser ? 'user' : ''}`;
            avatar.textContent = isUser ? 'U' : 'AI';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = text;
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = 'Just now';
            
            messageContent.appendChild(time);
            messageRow.appendChild(avatar);
            messageRow.appendChild(messageContent);
            chatMessages.appendChild(messageRow);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
            userInput.style.height = 'auto';
            userInput.value = '';
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, true);
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to generate response');
                }

                addMessage(data.response || '(no response)', false);

            } catch (error) {
                addMessage(`Error: ${error.message}`, false);
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
