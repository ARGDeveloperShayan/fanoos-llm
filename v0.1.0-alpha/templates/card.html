<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile LLM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .mobile-app {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .status-bar {
            padding: 15px 25px 5px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #333;
            background: white;
        }

        .time {
            font-weight: 600;
        }

        .signal {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header {
            padding: 20px 25px;
            text-align: center;
            background: white;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 85%;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-card.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        .message-card.assistant {
            align-self: flex-start;
            border-top-left-radius: 5px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .message-card.user .avatar {
            background: rgba(255, 255, 255, 0.2);
        }

        .message-card.assistant .avatar {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        .sender-name {
            font-weight: 600;
            font-size: 14px;
        }

        .message-card.user .sender-name {
            color: rgba(255, 255, 255, 0.9);
        }

        .message-card.assistant .sender-name {
            color: #6a11cb;
        }

        .card-content {
            line-height: 1.5;
        }

        .card-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 8px;
            text-align: right;
        }

        .quick-replies {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .quick-reply {
            padding: 10px 18px;
            background: #f5f7fa;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .quick-reply:hover {
            background: #6a11cb;
            color: white;
        }

        .input-section {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .voice-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f5f7fa;
            border-radius: 25px;
            padding: 5px 20px;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 16px;
            outline: none;
        }

        .attachment-btn, .send-btn {
            background: none;
            border: none;
            color: #6a11cb;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #999;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #6a11cb;
        }

        .nav-icon {
            font-size: 20px;
        }

        .nav-label {
            font-size: 12px;
        }

        /* Hide scrollbar but keep functionality */
        .quick-replies::-webkit-scrollbar,
        .chat-container::-webkit-scrollbar {
            display: none;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px 20px;
            background: white;
            border-radius: 20px;
            align-self: flex-start;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #6a11cb;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="mobile-app">
        <div class="status-bar">
            <div class="time">2:30 PM</div>
            <div class="signal">📶 🔋 84%</div>
        </div>

        <div class="header">
            <h1>Mobile LLM</h1>
            <p>AI in your pocket</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message-card assistant">
                <div class="card-header">
                    <div class="avatar">AI</div>
                    <div class="sender-name">Mobile Assistant</div>
                </div>
                <div class="card-content">
                    Hi! I'm your mobile AI assistant. I'm optimized for quick, helpful responses on the go.
                </div>
                <div class="card-time">2:30 PM</div>
            </div>
        </div>

        <div class="quick-replies">
            <div class="quick-reply" onclick="sendQuickReply('Hello!')">👋 Say hello</div>
            <div class="quick-reply" onclick="sendQuickReply('What can you do?')">What can you do?</div>
            <div class="quick-reply" onclick="sendQuickReply('Tell me a joke')">😄 Tell a joke</div>
            <div class="quick-reply" onclick="sendQuickReply('Help with math')">🧮 Math help</div>
            <div class="quick-reply" onclick="sendQuickReply('Weather today')">⛅ Weather</div>
        </div>

        <div class="input-section">
            <button class="voice-btn">🎤</button>
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type a message...">
                <button class="attachment-btn">📎</button>
            </div>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active">
                <div class="nav-icon">💬</div>
                <div class="nav-label">Chat</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">⭐</div>
                <div class="nav-label">Favorites</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">👤</div>
                <div class="nav-label">Profile</div>
            </div>
            <div class="nav-item">
                <div class="nav-icon">⚙️</div>
                <div class="nav-label">Settings</div>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendQuickReply(text) {
            userInput.value = text;
            sendMessage();
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return typingDiv;
        }

        function addMessage(text, isUser) {
            const messageCard = document.createElement('div');
            messageCard.className = `message-card ${isUser ? 'user' : 'assistant'}`;
            
            const cardHeader = document.createElement('div');
            cardHeader.className = 'card-header';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? 'U' : 'AI';
            
            const senderName = document.createElement('div');
            senderName.className = 'sender-name';
            senderName.textContent = isUser ? 'You' : 'Mobile Assistant';
            
            const cardContent = document.createElement('div');
            cardContent.className = 'card-content';
            cardContent.textContent = text;
            
            const cardTime = document.createElement('div');
            cardTime.className = 'card-time';
            cardTime.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            cardHeader.appendChild(avatar);
            cardHeader.appendChild(senderName);
            
            messageCard.appendChild(cardHeader);
            messageCard.appendChild(cardContent);
            messageCard.appendChild(cardTime);
            
            chatContainer.appendChild(messageCard);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            userInput.value = '';
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, true);
            
            const typingIndicator = showTyping();

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                
                chatContainer.removeChild(typingIndicator);

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to generate response');
                }

                addMessage(data.response || '(no response)', false);

            } catch (error) {
                chatContainer.removeChild(typingIndicator);
                addMessage(`Error: ${error.message}`, false);
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
